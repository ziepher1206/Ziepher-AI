name: Refresh dependency security

on:
  push:
    branches: [security/dependency-audit]
    paths:
      - ".github/workflows/dependency-refresh.yml"

permissions:
  contents: write

jobs:
  refresh:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: security/dependency-audit
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Upgrade npm resolver
        run: npm install --global npm@11

      - name: Refresh vulnerable dependencies
        run: |
          npm install --package-lock-only --save-exact next@16.3.4 eslint-config-next@16.3.4 vitest@4.1.11
          npm ci

      - name: Validate dependency audit
        run: npm audit --audit-level=moderate

      - name: Validate project
        run: |
          npm run typecheck
          npm run lint
          npm test
          npm run build

      - name: Commit repaired dependency graph
        run: |
          if git diff --quiet -- package.json package-lock.json; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          git commit -m "security: refresh vulnerable dependencies"
          git push origin HEAD:security/dependency-audit
