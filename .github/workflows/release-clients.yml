name: Package installable Ziepher clients

on:
  workflow_dispatch:
    inputs:
      app_url:
        description: Hosted Ziepher AI HTTPS origin
        required: true
        default: https://app.ziepher.ai
      release_tag:
        description: Release tag
        required: true
        default: ziepher-v0.5.0
  push:
    tags:
      - "ziepher-v*"

permissions:
  contents: write

jobs:
  web-quality:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.16.0"
          cache: npm
      - run: npm ci
      - run: npm run check

  desktop:
    needs: web-quality
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu-22.04
            args: ""
          - platform: windows-latest
            args: ""
          - platform: macos-latest
            args: "--target aarch64-apple-darwin"
          - platform: macos-latest
            args: "--target x86_64-apple-darwin"
    runs-on: ${{ matrix.platform }}
    env:
      ZIEPHER_APP_URL: ${{ inputs.app_url || 'https://app.ziepher.ai' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.16.0"
          cache: npm
          cache-dependency-path: clients/desktop/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ startsWith(matrix.platform, 'macos') && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}
      - name: Install Linux desktop dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - run: npm ci
        working-directory: clients/desktop
      - uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: clients/desktop
          tagName: ${{ inputs.release_tag || github.ref_name }}
          releaseName: "Ziepher AI __VERSION__"
          releaseBody: "Install Ziepher AI. The secure build engine runs in the Ziepher cloud; no developer tools are required."
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}
          uploadWorkflowArtifacts: true
          workflowArtifactNamePattern: "[platform]-[arch]-[bundle]"

  android:
    needs: web-quality
    runs-on: ubuntu-22.04
    env:
      ZIEPHER_APP_URL: ${{ inputs.app_url || 'https://app.ziepher.ai' }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.16.0"
          cache: npm
          cache-dependency-path: clients/mobile/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle
      - run: npm ci
        working-directory: clients/mobile
      - run: npx cap sync android
        working-directory: clients/mobile
      - name: Restore Android release keystore
        if: ${{ env.ANDROID_KEYSTORE_BASE64 != '' }}
        shell: bash
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 --decode > "$RUNNER_TEMP/ziepher-release.jks"
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/ziepher-release.jks" >> "$GITHUB_ENV"
      - name: Build installable APK and store bundle
        working-directory: clients/mobile/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug bundleRelease
      - uses: actions/upload-artifact@v4
        with:
          name: ziepher-android
          path: |
            clients/mobile/android/app/build/outputs/apk/debug/*.apk
            clients/mobile/android/app/build/outputs/bundle/release/*.aab
          if-no-files-found: error

  ios-simulator:
    needs: web-quality
    runs-on: macos-latest
    env:
      ZIEPHER_APP_URL: ${{ inputs.app_url || 'https://app.ziepher.ai' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.16.0"
          cache: npm
          cache-dependency-path: clients/mobile/package-lock.json
      - run: npm ci
        working-directory: clients/mobile
      - run: npx cap sync ios
        working-directory: clients/mobile
      - name: Validate unsigned iOS application
        working-directory: clients/mobile
        run: |
          xcodebuild \
            -project ios/App/App.xcodeproj \
            -scheme App \
            -sdk iphonesimulator \
            -configuration Release \
            -derivedDataPath ios/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            build
      - uses: actions/upload-artifact@v4
        with:
          name: ziepher-ios-simulator
          path: clients/mobile/ios/DerivedData/Build/Products/Release-iphonesimulator/*.app
          if-no-files-found: error
