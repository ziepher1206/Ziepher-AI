[package]
name = "ziepher-ai"
version = "0.7.0"
description = "Ziepher AI desktop client"
authors = ["Ziepher AI"]
edition = "2021"

[lib]
name = "ziepher_ai_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
url = "2"
serde = { version = "1", features = ["derive"] }
sha2 = "0.10"
uuid = { version = "1", features = ["v4"] }
walkdir = "2"
